id: io.github.astralvixen.geforce-infinity
runtime: org.freedesktop.Platform
runtime-version: "25.08"
sdk: org.freedesktop.Sdk
base: org.electronjs.Electron2.BaseApp
base-version: "25.08"
sdk-extensions:
    - org.freedesktop.Sdk.Extension.node22

command: geforce-infinity

build-options:
    append-path: /usr/lib/sdk/node22/bin

finish-args:
    - --share=network
    - --share=ipc
    - --socket=x11
    - --socket=pulseaudio
    - --filesystem=xdg-run/discord-ipc-0
    - --filesystem=xdg-run/app/com.discordapp.Discord:create
    - --device=all
    - --filesystem=/run/udev:ro

modules:
    - name: geforce-infinity
      buildsystem: simple
      build-options:
          env:
              XDG_CACHE_HOME: /run/build/geforce-infinity/flatpak-node/cache
              npm_config_cache: /run/build/geforce-infinity/flatpak-node/npm-cache
              npm_config_nodedir: /usr/lib/sdk/node22
              npm_config_offline: "true"
      build-commands:
          - |
              set -e
              jq 'del(.devDependencies["@esbuild/linux-x64"]) | .devDependencies.esbuild = "^0.27.0" | .build.electronVersion = .devDependencies.electron' package.json > package.json.tmp
              mv package.json.tmp package.json
              HOME=$PWD yarn config --offline set yarn-offline-mirror $FLATPAK_BUILDER_BUILDDIR/flatpak-node/yarn-mirror
              yarn --offline install
              APP_VERSION=$(jq -r .version package.json)
              export APP_VERSION
              yarn --offline run tailwindcss -i src/overlay/index.css -o dist/assets/tailwind.bundle.css --minify
              yarn --offline run esbuild src/overlay/index.tsx --bundle --outdir=dist/overlay --format=esm --target=esnext --external:electron --splitting --minify --jsx=automatic --jsx-import-source=react --define:__APP_VERSION__="\"$APP_VERSION\"" --entry-names=[name]
              yarn --offline run tsc -p tsconfig.electron.json
              yarn --offline run cpx 'src/assets/**/*' dist/assets
              . flatpak-node/electron-builder-arch-args.sh; yarn --offline run electron-builder --dir --linux $ELECTRON_BUILDER_ARCH_ARGS
              mkdir -p $FLATPAK_DEST/geforce-infinity
              cp -a builds/linux*unpacked/* $FLATPAK_DEST/geforce-infinity/
              test -x "$FLATPAK_DEST/geforce-infinity/geforce-infinity"
              test -s "$FLATPAK_DEST/geforce-infinity/resources/app.asar"
              install -Dm 644 "icon.png" "${FLATPAK_DEST}/share/icons/hicolor/512x512/apps/${FLATPAK_ID}.png"
              install -Dm 644 "${FLATPAK_ID}.metainfo.xml" "${FLATPAK_DEST}/share/metainfo/${FLATPAK_ID}.metainfo.xml"
              install -Dm 755 "geforce-infinity.sh" "/app/bin/geforce-infinity"
              install -Dm 644 "${FLATPAK_ID}.desktop" "${FLATPAK_DEST}/share/applications/${FLATPAK_ID}.desktop"

      sources:
          - type: archive
            url: https://github.com/AstralVixen/GeForce-Infinity/archive/refs/tags/1.2.2.zip
            dest-filename: geforce-infinity.zip
            sha256: b79d586915e524684e0dff1901e381b4d0e9791ae991e025045ed6441feadce9
            x-checker-data:
                type: json
                url: https://api.github.com/repos/AstralVixen/GeForce-Infinity/releases/latest
                version-query: .tag_name | sub("^v"; "")
                url-query: '"https://github.com/AstralVixen/GeForce-Infinity/archive/refs/tags/\($version).zip"'

          - type: patch
            path: files/electron-44.patch

          - generated-sources.json

          - type: script
            dest-filename: geforce-infinity.sh
            commands:
                - |
                    unset ELECTRON_RUN_AS_NODE
                    if [ "$(uname -m)" = "aarch64" ]; then
                        export MESA_LOADER_DRIVER_OVERRIDE=zink
                    fi
                    export TMPDIR="$XDG_RUNTIME_DIR/app/$FLATPAK_ID"
                    exec zypak-wrapper /app/geforce-infinity/geforce-infinity "$@"

          - type: file
            path: files/icon.png

          - type: file
            path: files/io.github.astralvixen.geforce-infinity.desktop

          - type: file
            path: files/io.github.astralvixen.geforce-infinity.metainfo.xml

          - type: script
            commands:
                - for i in {0..9}; do
                - test -S $XDG_RUNTIME_DIR/discord-ipc-$i || ln -sf {app/com.discordapp.Discord,$XDG_RUNTIME_DIR}/discord-ipc-$i;
                - done
